name: Ask API deploy

# 只有默认分支上的这个文件会生效。Pages 工作流成功之后才进入这里。
# 仓库变量 ASK_DEPLOY_ENABLED 未设为 true 时整段跳过，避免在密钥和 D1 还没手工配好时部署。
on:
  workflow_run:
    workflows:
      - "Build and Deploy"
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ask-api
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master') &&
      vars.ASK_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Build knowledge
        working-directory: backend
        env:
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
          EMBEDDING_DIMENSIONS: ${{ secrets.EMBEDDING_DIMENSIONS }}
        run: node --experimental-strip-types scripts/build-knowledge.ts --out src/generated/knowledge.ts

      - name: Refuse mock knowledge
        working-directory: backend
        run: node --experimental-strip-types -e "import { readFileSync } from 'node:fs'; const text = readFileSync('src/generated/knowledge.ts','utf8'); if (text.includes('bundledKnowledge: KnowledgeBundle | null = null') || text.includes('\"provider\":\"mock\"')) { console.error('知识包未通过真实构建'); process.exit(1); }"

      - name: Deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
