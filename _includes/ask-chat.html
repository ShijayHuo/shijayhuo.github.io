<div id="ask-app" class="ask-chat" data-ask-state="empty">
  <p id="ask-status" class="ask-sr" role="status"></p>
  <div id="ask-mock-note" class="ask-mock-note" hidden>
    <span>模拟传输</span>
    <label class="ask-mock-label">场景
      <select id="ask-mock-scenario" aria-label="模拟场景"></select>
    </label>
    <span>回放契约样例，不是线上问答。显示的次数不是访问限额。</span>
  </div>

  <div id="ask-empty" class="ask-empty">
    <h2 class="ask-greet" id="ask-greet">下午好</h2>
    <form id="ask-empty-form" class="ask-form" method="post" action="{{ '/ask/' | relative_url }}">
      <div class="ask-field">
        <label class="ask-sr" for="ask-empty-input">问题</label>
        <textarea
          id="ask-empty-input"
          rows="3"
          placeholder="想了解阿杰的经历，或找某个话题的文章？在这里问我"
          autocomplete="off"
          enterkeyhint="send"
        ></textarea>
        <div class="ask-field-bar">
          <p id="ask-empty-hint" class="ask-hint" role="status"></p>
          <button id="ask-empty-send" class="ask-send" type="submit">发送</button>
        </div>
      </div>
    </form>
  </div>

  <div id="ask-thread" class="ask-thread" hidden>
    <h2 class="ask-sr">AI 问答</h2>
    <div id="ask-messages" class="ask-messages" aria-label="对话" tabindex="-1"></div>
  </div>

  <div class="ask-footer">
    <p id="ask-remaining" class="ask-remaining" hidden></p>
    <form id="ask-chat-form" class="ask-form ask-composer" method="post" action="{{ '/ask/' | relative_url }}" hidden>
    <div class="ask-field">
      <label class="ask-sr" for="ask-chat-input">消息</label>
      <textarea
        id="ask-chat-input"
        rows="2"
        placeholder="想了解阿杰的经历，或找某个话题的文章？在这里问我"
        autocomplete="off"
        enterkeyhint="send"
      ></textarea>
      <div class="ask-field-bar">
        <p id="ask-chat-hint" class="ask-hint" role="status"></p>
        <div class="ask-field-actions">
          <button id="ask-stop" class="ask-stop" type="button" hidden>停止</button>
          <button id="ask-chat-send" class="ask-send" type="submit">发送</button>
        </div>
      </div>
    </div>
      </form>
  </div>
</div>

<script src="{{ '/assets/js/ask-sse.js' | relative_url }}"></script>
<script src="{{ '/assets/js/ask-fixtures.js' | relative_url }}"></script>
<script src="{{ '/assets/js/ask-demo.js' | relative_url }}"></script>
