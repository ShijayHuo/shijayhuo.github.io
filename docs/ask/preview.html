  <style>
    :root[data-bs-theme="light"] {
      color-scheme: light;
      --main-bg: #fff;
      --text-color: #34343c;
      --text-muted-color: #757575;
      --heading-color: #2a2a2a;
      --link-color: #0056b2;
      --btn-border-color: #e9ecef;
      --sidebar-bg: #f6f8fa;
      --sidebar-active: #1d1d1d;
      --main-border-color: #f3f3f3;
    }
    :root[data-bs-theme="dark"] {
      color-scheme: dark;
      --main-bg: rgb(27, 27, 30);
      --text-color: rgb(175, 176, 177);
      --text-muted-color: #868686;
      --heading-color: #ccc;
      --link-color: rgb(138, 180, 248);
      --btn-border-color: #2e2f31;
      --sidebar-bg: #161618;
      --sidebar-active: #eee;
      --main-border-color: rgb(44, 45, 45);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--main-bg);
      color: var(--text-color);
      font-family: "Source Sans Pro", "Microsoft Yahei", sans-serif;
    }
    a { color: var(--link-color); }
    .preview-banner {
      margin: 0;
      padding: 0.45rem 1rem;
      background: var(--sidebar-bg);
      color: var(--text-muted-color);
      font-size: 0.82rem;
      text-align: center;
    }
    .layout { display: flex; min-height: calc(100vh - 2rem); }
    #sidebar {
      width: 220px;
      flex: 0 0 220px;
      padding: 1.4rem 1rem;
      background: var(--sidebar-bg);
    }
    .site-title { color: var(--heading-color); font-weight: 700; text-decoration: none; }
    .site-subtitle { margin: 0.25rem 0 1rem; color: var(--text-muted-color); font-size: 0.9rem; }
    .nav-item { list-style: none; margin: 0.15rem 0; }
    .nav { margin: 0; padding: 0; }
    .nav-link {
      display: block;
      padding: 0.35rem 0.55rem;
      border-radius: 0.45rem;
      color: var(--text-color);
      text-decoration: none;
    }
    .nav-item.active .nav-link, .nav-link:hover { color: var(--sidebar-active); background: color-mix(in srgb, var(--link-color) 8%, transparent); }
    #main { flex: 1 1 auto; min-width: 0; padding: 1.2rem 1.25rem 2rem; }
    .topbar { display: flex; justify-content: flex-end; margin-bottom: 0.4rem; }
    #theme-toggle, .menu-button {
      border: 1px solid var(--btn-border-color);
      background: var(--main-bg);
      color: var(--text-color);
      border-radius: 0.45rem;
      padding: 0.25rem 0.7rem;
      font: inherit;
      cursor: pointer;
    }
    .menu-button { display: none; margin-right: auto; }
    #topbar-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    #post-list { max-width: 42rem; margin: 0 auto; }
    .post-link {
      display: block;
      padding: 0.95rem 0;
      border-top: 1px solid var(--main-border-color);
      color: var(--heading-color);
      font-size: 1.2rem;
      font-weight: 650;
      text-decoration: none;
    }
    @media (max-width: 849px) {
      #sidebar { display: none; }
      #sidebar.open { display: block; position: fixed; z-index: 6; inset: 0 auto 0 0; }
      .menu-button { display: inline-block; }
    }

.ask-sr {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.ask-demo-mark {
  display: block;
  margin: -0.15rem 0 0.45rem 3.15rem;
  color: var(--text-muted-color);
  font-size: 0.68rem;
  line-height: 1.2;
  pointer-events: none;
}

.ask-hero,
.ask-empty {
  color: var(--text-color);
  background: transparent;
  box-shadow: none;
  border: 0;
}

.ask-hero {
  margin: 0.75rem 0 0;
  padding: 0.4rem 0 0;
  text-align: center;
}

.ask-hero + #post-list {
  margin-top: 2rem;
}

.ask-hero h2,
.ask-greet {
  margin: 0;
  color: var(--heading-color);
  font-size: 2rem;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.02em;
}

.ask-hero .anchor {
  display: none;
}

.ask-form {
  width: 100%;
  max-width: 42rem;
  margin: 1.35rem auto 0;
  text-align: left;
}

.ask-field {
  border: 1px solid var(--btn-border-color);
  border-radius: 0.9rem;
  background: var(--main-bg);
  padding: 0.35rem 0.45rem 0.45rem;
}

.ask-field:focus-within {
  border-color: var(--link-color);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--link-color) 16%, transparent);
}

.ask-field textarea {
  display: block;
  width: 100%;
  min-height: 6.2rem;
  resize: vertical;
  border: 0;
  background: transparent;
  color: var(--text-color);
  padding: 0.7rem 0.7rem 0.2rem;
  font: inherit;
  font-size: 16px;
  line-height: 1.65;
}

.ask-field textarea:focus {
  outline: none;
}

.ask-field textarea::placeholder {
  color: var(--text-muted-color);
}

.ask-field-bar,
.ask-field-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.65rem;
}

.ask-hint {
  margin: 0;
  margin-right: auto;
  color: var(--heading-color);
  font-size: 0.84rem;
}

.ask-hint:empty {
  display: none;
}

.ask-send,
.ask-stop {
  flex: 0 0 auto;
  min-height: 2.15rem;
  border-radius: 0.55rem;
  padding: 0.3rem 0.9rem;
  font: inherit;
  font-size: 0.92rem;
  cursor: pointer;
}

.ask-send {
  border: 1px solid var(--btn-border-color);
  background: var(--main-bg);
  color: var(--text-color);
}

.ask-send:hover,
.ask-send:focus-visible,
.ask-stop:hover,
.ask-stop:focus-visible {
  border-color: var(--link-color);
  color: var(--link-color);
}

.ask-send[aria-disabled='true'],
.ask-send[aria-busy='true'] {
  opacity: 0.45;
  cursor: not-allowed;
}

.ask-stop {
  border: 1px solid var(--btn-border-color);
  background: transparent;
  color: var(--text-color);
}

.ask-empty[hidden],
.ask-thread[hidden],
.ask-composer[hidden],
.ask-pending[hidden],
.ask-stopped[hidden],
.ask-error[hidden],
.ask-sources[hidden],
.ask-mock-note[hidden],
.ask-remaining[hidden],
#ask-stop[hidden] {
  display: none !important;
}

body:has(#ask-app):not(:has(#view-home)) h1.dynamic-title {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;

body:has(#ask-app):not(:has(#view-home)) #panel-wrapper,

body:has(#ask-app):not(:has(#view-home)) main,
body:has(#view-ask:not([hidden])) main {

  max-width: 48rem !important;
  margin-inline: auto;
}

.ask-chat {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: calc(100vh - 7rem);
  color: var(--text-color);
}

html:has(#ask-app) {
  scroll-padding-bottom: 9rem;
}

.ask-empty {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 2.5rem 0 4rem;
  text-align: center;
}

.ask-thread {
  width: min(42rem, 100%);
  margin: 0.5rem auto 0;
  padding-bottom: 1rem;
}

.ask-messages {
  display: flex;
  flex-direction: column;
  gap: 1.35rem;
}

.ask-messages:focus {
  outline: none;
}

.ask-msg {
  display: flex;
  scroll-margin-bottom: 9rem;
}

.ask-msg-user {
  justify-content: flex-end;
}

.ask-msg-assistant {
  justify-content: flex-start;
}

.ask-bubble {
  max-width: min(36rem, 100%);
  line-height: 1.75;
  background: transparent;
  box-shadow: none;
}

.ask-msg-user .ask-bubble {
  max-width: min(28rem, 86%);
  padding: 0.55rem 0.85rem;
  border-radius: 1rem 1rem 0.3rem 1rem;
  background: color-mix(in srgb, var(--heading-color) 8%, var(--main-bg));
}

.ask-msg-assistant .ask-bubble {
  width: 100%;
  padding: 0.15rem 0 0;
}

.ask-bubble-text {
  white-space: pre-wrap;
  word-break: break-word;
}

.ask-msg-user .ask-bubble-text {
  color: var(--heading-color);
}

.ask-pending,
.ask-stopped,
.ask-error {
  margin: 0.35rem 0 0;
  color: var(--text-muted-color);
  font-size: 0.84rem;
}

.ask-mock-note {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem 0.65rem;
  width: min(42rem, 100%);
  margin: 0 auto 0.75rem;
  color: var(--text-muted-color);
  font-size: 0.78rem;
  line-height: 1.45;
  text-align: left;
}

.ask-mock-note select {
  margin-left: 0.3rem;
  border: 1px solid var(--btn-border-color);
  border-radius: 0.35rem;
  background: var(--main-bg);
  color: var(--text-color);
  font: inherit;
}

.ask-footer {
  position: sticky;
  bottom: 0;
  z-index: 4;
  width: min(42rem, 100%);
  margin: auto auto 0;
  background: var(--main-bg);
}

.ask-remaining {
  margin: 0 0 0.35rem;
  color: var(--text-muted-color);
  font-size: 0.8rem;
  line-height: 1.4;
  text-align: center;
}

.ask-sources {
  margin-top: 0.85rem;
}

.ask-sources ul {
  margin: 0;
  padding-left: 1.1rem;
}

.ask-sources a {
  color: var(--link-color);
}

.ask-composer {
  position: static;
  width: 100%;
  margin: 0;
  padding-top: 0.35rem;
  padding-bottom: calc(0.45rem + env(safe-area-inset-bottom));
  background: var(--main-bg);
}

@media (max-width: 767.98px) {
  .ask-hero h2,
  .ask-greet {
    font-size: 1.65rem;
  }

  .ask-hero {
    margin-top: 0.35rem;
  }

  .ask-demo-mark {
    margin-left: 2.4rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ask-field,
  .ask-send,
  .ask-stop {
    transition: none;
  }
}

  <script>/* Ask protocol helpers. Contract version 1: docs/ask/contract.md.

(function (root, factory) {

    unconfigured: "问答服务尚未配置。",
    tooLong: "问题太长。",
    tooBig: "请求太大。",
    timeout: "回答超时，已停止等待。",
    stopped: "已停止",
    quota: "已达到 20 次上限"
  };

  var LIMITS = {
    question: 2000,
    history: 6,
    content: 4000,
    sourceIds: 8,
    sourceId: 64,
    title: 120,
    heading: 160,
    version: 64,
    bodyBytes: 32768,
    remainingMax: 19,
    timeoutMs: 25000

  function clipChars(value, max) {
    var chars = Array.from(String(value == null ? "" : value));
    if (chars.length <= max) return chars.join("");
    return chars.slice(0, max).join("");
  }

  function charLength(value) {

  }

  function utf8Bytes(value) {
    if (typeof TextEncoder !== "undefined") return new TextEncoder().encode(value).length;

  }

  function readRemaining(value) {
    if (typeof value !== "number" || !Number.isInteger(value)) return null;
    if (value < 0 || value > LIMITS.remainingMax) return null;

  }

    if (typeof value !== "string") return null;
    if (value.length < 1 || value.length > LIMITS.version) return null;
    if (!VERSION_RE.test(value)) return null;

  }

  function isSourceId(value) {
    return typeof value === "string" && value.length >= 1 && value.length <= LIMITS.sourceId && ID_RE.test(value);
  }

  function validateSource(raw, seen) {
    if (!raw || typeof raw !== "object") return null;
    var url = typeof raw.url === "string" ? raw.url : "";

    if (seen && seen[url]) return null;
    var title = typeof raw.title === "string" ? clipChars(raw.title, LIMITS.title) : "";

    var heading = typeof raw.heading === "string" ? clipChars(raw.heading, LIMITS.heading) : "";

    return { id: id, title: title, url: url, heading: heading };

  function acceptSources(list) {
    var seen = {};

    list.forEach(function (item) {

    var eventName = "message";
    var dataLines = [];

      var line = lines[i];

      credentials: "omit",
      headers: {
        "Content-Type": "application/json",
        Accept: "text/event-stream"

    var turn = createTurn();
    (events || []).forEach(function (event) {
      applySseEvent(turn, event);

  }

  return {
    URL_RE: URL_RE,

    resolveMode: resolveMode,
    createHistory: createHistory,

    createFetchInit: createFetchInit,
    reduceEvents: reduceEvents

function selectedScenario() {

    try {

  function scoreIntent(text, intent) {
    if (!intent.keys.length) return 0;
    var normalized = norm(text);
    var score = 0;
    intent.keys.forEach(function (key) {
      var needle = norm(key);
      if (needle && normalized.indexOf(needle) !== -1) score += needle.length;
    });
    return score;
  }

    INTENTS.forEach(function (intent) {

      var score = scoreIntent(text, intent);
      if (score > bestScore) {
        best = intent;
        bestScore = score;
      }
    });
    return best;
  }

    var el = document.getElementById("ask-status");
    if (el) el.textContent = message || "";
  }

  function chatIsActive() {
    if (!document.getElementById("ask-app")) return false;
    if (runtime !== "file") return true;
    var view = document.getElementById("view-ask");
    return !view || !view.hidden;
  }

  function setGeneratingUI(on) {
    var stop = document.getElementById("ask-stop");
    var send = document.getElementById("ask-chat-send");
    if (stop) stop.hidden = !on;
    if (send) send.setAttribute("aria-disabled", on ? "true" : "false");
  }

  function linkElement(source) {
    var pack = api();
    if (!source || !pack || !pack.URL_RE.test(source.url)) return null;
    var anchor = document.createElement("a");
    anchor.href = hrefFor(source.url);
    anchor.textContent = source.title || "";
    if (source.heading) anchor.setAttribute("title", source.heading);
    if (runtime === "file") {
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
    }
    return anchor;
  }

  function fillSources(sources, message) {
    var hasSources = message.sources && message.sources.length && !message.pending;
    sources.hidden = !hasSources;
    sources.replaceChildren();
    if (!hasSources) return;
    var list = document.createElement("ul");
    message.sources.forEach(function (source) {
      var anchor = linkElement(source);
      if (!anchor) return;
      var item = document.createElement("li");
      item.appendChild(anchor);
      list.appendChild(item);
    });
    if (!list.childNodes.length) {
      sources.hidden = true;
      return;
    }
    sources.appendChild(list);
  }

  function renderMessage(message) {
    var article = document.createElement("article");
    article.className = "ask-msg ask-msg-" + (message.role === "user" ? "user" : "assistant");
    article.dataset.id = message.id;
    var bubble = document.createElement("div");
    bubble.className = "ask-bubble";
    var text = document.createElement("div");
    text.className = "ask-bubble-text";
    text.textContent = message.text || "";
    bubble.appendChild(text);
    if (message.role === "user") {
      article.appendChild(bubble);
      return article;
    }
    var pending = document.createElement("p");
    pending.className = "ask-pending";
    pending.textContent = "正在生成";
    pending.hidden = !(message.pending && !message.text);
    bubble.insertBefore(pending, text);
    var stopped = document.createElement("p");
    stopped.className = "ask-stopped";
    stopped.textContent = textOf("stopped");
    stopped.hidden = !message.stopped;
    bubble.appendChild(stopped);
    var error = document.createElement("p");
    error.className = "ask-error";
    error.textContent = message.errorText || "";
    error.hidden = !message.errorText;
    bubble.appendChild(error);
    var sources = document.createElement("div");
    sources.className = "ask-sources";
    fillSources(sources, message);
    bubble.appendChild(sources);
    article.appendChild(bubble);
    return article;
  }

  function renderSession(session) {
    var box = document.getElementById("ask-messages");
    var empty = document.getElementById("ask-empty");
    if (!box) return;
    var messages = session && session.messages ? session.messages : [];
    box.replaceChildren();
    messages.forEach(function (message) {
      box.appendChild(renderMessage(message));
    });
    var hasMessages = messages.length > 0;
    var thread = document.getElementById("ask-thread");
    var composer = document.getElementById("ask-chat-form");
    var app = document.getElementById("ask-app");
    if (empty) empty.hidden = hasMessages;
    if (thread) thread.hidden = !hasMessages;
    if (composer) composer.hidden = !hasMessages;
    if (app) app.setAttribute("data-ask-state", hasMessages ? "chat" : "empty");
    var last = box.lastElementChild;
    if (last && messages.length && followAnswer) reveal(last);
    updateRemaining(loadRemaining());
  }

  function nearBottom() {
    var doc = document.documentElement;
    return doc.scrollHeight - (window.scrollY + window.innerHeight) < 180;
  }

  function reveal(node) {
    if (!node) return;
    scrollLock += 1;
    node.scrollIntoView({ block: "nearest" });
    window.requestAnimationFrame(function () {
      scrollLock = Math.max(0, scrollLock - 1);
    });
  }

  function paintAssistant(message) {
    var node = document.querySelector('#ask-messages [data-id="' + message.id + '"]');
    if (!node) return false;
    var text = node.querySelector(".ask-bubble-text");
    var pending = node.querySelector(".ask-pending");
    var stopped = node.querySelector(".ask-stopped");
    var error = node.querySelector(".ask-error");
    var sources = node.querySelector(".ask-sources");
    if (text) text.textContent = message.text || "";
    if (pending) pending.hidden = !(message.pending && !message.text);
    if (stopped) stopped.hidden = !message.stopped;
    if (error) {
      error.textContent = message.errorText || "";
      error.hidden = !message.errorText;
    }
    if (sources) fillSources(sources, message);
    if (followAnswer) reveal(node);
    return true;
  }

  function copyTurn(message, turn) {
    message.text = turn.text || "";
    message.sources = turn.sources || [];
    message.sourceIds = turn.sourceIds || [];
    message.pending = !!turn.pending && !turn.terminal;
    message.stopped = !!turn.stopped;
    message.stopKind = turn.stopKind || "";
    message.errorText = turn.errorText || "";
    message.complete = !!turn.complete;
    message.failed = !!turn.failed;
    if (typeof turn.remaining === "number") saveRemaining(turn.remaining);
  }

  function persistTurn(sessionId, assistantId, turn) {
    var store = loadStore();
    var session = store.sessions[sessionId];
    if (!session) return null;
    var message = null;
    session.messages.forEach(function (item) {
      if (item.id === assistantId) message = item;
    });
    if (!message) return null;
    copyTurn(message, turn);
    session.updatedAt = Date.now();
    saveStore(store);
    if (!paintAssistant(message)) renderSession(session);
    else updateRemaining(loadRemaining());
    return message;
  }

  function priorMessages(session, userMessageId, assistantId) {
    return (session.messages || []).filter(function (message) {
      return message.id !== userMessageId && message.id !== assistantId;
    });
  }

  function validatedSources(list) {
    var pack = api();
    if (!pack) return [];
    return pack.acceptSources((list || []).map(function (source) {
      return { id: source.id || "", title: source.title || "", url: source.url || "", heading: source.heading || "" };
    }));
  }

  function scenarioFile(scenario, history) {
    if (scenario === "normal") return history && history.length ? "sse-followup.txt" : "sse-success.txt";
    if (scenario === "stop" || scenario === "hang") return "sse-cancelled.txt";
    if (scenario === "quota") return "http-429.json";
    if (scenario === "unconfigured") return "http-503.json";
    if (scenario === "failure") return "sse-upstream-error.txt";
    if (scenario === "upstream") return "http-502.json";
    if (scenario === "forbidden") return "http-403-origin.json";
    if (scenario === "refusal") return "sse-refusal.txt";
    return "";
  }

  function fixtureFile(name) {
    var pack = window.ASK_FIXTURES;
    if (!pack || pack.contractVersion !== 1 || !pack.files) return null;
    return pack.files[name] || null;
  }

  function mockDelay() {
    var value = Number(window.ASK_MOCK_DELAY_MS);
    if (value >= 0 && value <= 5000) return value;
    return 70;
  }

  function timeoutDelay() {
    var value = Number(window.ASK_TIMEOUT_MS);
    if (value >= 50 && value <= 25000) return value;
    return 25000;
  }

  function statusFor(turn) {
    if (turn.stopped && turn.stopKind === "timeout") return textOf("timeout");
    if (turn.stopped) return textOf("stopped");
    if (turn.errorText) return turn.errorText;
    if (turn.failed && turn.text) return turn.text;
    return "";
  }

  function startGeneration(sessionId, userMessageId) {
    if (active && active.sessionId === sessionId && active.userMessageId === userMessageId) return;
    if (active) stopActive("user");
    var store = loadStore();
    var session = store.sessions[sessionId];
    if (!session) return;
    var userMessage = null;
    session.messages.forEach(function (message) {
      if (message.id === userMessageId) userMessage = message;
    });
    if (!userMessage) return;
    var existing = null;
    session.messages.forEach(function (message) {
      if (message.role === "assistant" && message.replyTo === userMessageId) existing = message;
    });
    if (existing && !existing.pending) {
      renderSession(session);
      setGeneratingUI(false);
      return;
    }
    var mode = currentMode();
    if (existing && existing.pending && mode !== "demo") {
      existing.pending = false;
      existing.stopped = true;
      existing.complete = false;
      session.updatedAt = Date.now();
      saveStore(store);
      renderSession(session);
      setGeneratingUI(false);
      setStatus(textOf("stopped"));
      return;
    }

    var pack = api();
    var turn = pack ? pack.createTurn() : {
      text: "",
      sources: [],
      sourceIds: [],
      remaining: null,
      pending: true,
      stopped: false,
      stopKind: "",
      errorText: "",
      terminal: false,
      complete: false,
      failed: false,
      sawSources: false
    };
    if (!existing) {
      existing = {
        id: nid("m"),
        role: "assistant",
        replyTo: userMessageId,
        text: "",
        pending: true,
        stopped: false,
        sources: [],
        sourceIds: [],
        complete: false,
        failed: false,
        errorText: ""
      };
      session.messages.push(existing);
      session.updatedAt = Date.now();
      saveStore(store);
    } else if (mode === "demo" && existing.text) {
      turn.text = existing.text;
    }

    var controller = typeof AbortController === "function" ? new AbortController() : { signal: {}, abort: function () {} };
    var timeoutId = 0;
    var intervalId = 0;
    var settled = false;
    var abortReason = "";
    var assistantId = existing.id;
    active = {
      sessionId: sessionId,
      userMessageId: userMessageId,
      assistantId: assistantId,
      controller: controller
    };
    setGeneratingUI(true);
    followAnswer = true;
    setStatus("正在生成");
    renderSession(loadStore().sessions[sessionId]);
    var questions = document.querySelectorAll("#ask-messages .ask-msg-user");
    var question = questions[questions.length - 1];
    var chatInput = document.getElementById("ask-chat-input");
    if (question && document.activeElement !== chatInput) {
      question.tabIndex = -1;
      question.focus({ preventScroll: true });
    }

    function finish(reason) {
      if (settled) return;
      settled = true;
      if (timeoutId) window.clearTimeout(timeoutId);
      if (intervalId) window.clearInterval(intervalId);
      if (!turn.terminal && pack) {
        if (reason === "timeout") pack.applyTimeout(turn);
        else if (reason === "user" || reason === "leave") pack.applyStop(turn);
        else if (!turn.text) pack.applyLocalMessage(turn, textOf("network"));
        else pack.applyIncomplete(turn);
      } else if (!turn.terminal && !pack) {
        turn.terminal = true;
        turn.pending = false;
        turn.failed = true;
        turn.text = textOf("unconfigured");
      }
      persistTurn(sessionId, assistantId, turn);
      if (active && active.assistantId === assistantId) active = null;
      setGeneratingUI(false);
      setStatus(statusFor(turn));
    }

    if (controller.signal && controller.signal.addEventListener) {
      controller.signal.addEventListener("abort", function () {
        var reason = abortReason;
        if (!reason && typeof controller.signal.reason === "string") reason = controller.signal.reason;
        finish(reason || "user");
      });
    }

    function stopWith(reason) {
      abortReason = reason;
      try {
        controller.abort(reason);
      } catch (error) {
        try { controller.abort(); } catch (again) { finish(reason); }
      }
      if (!controller.signal || !controller.signal.aborted) finish(reason);
    }
    active.stop = stopWith;

    if (mode === "api" || mode === "mock") {
      timeoutId = window.setTimeout(function () { stopWith("timeout"); }, timeoutDelay());
    }

    if (mode === "demo") {
      runDemo(session, userMessage.text, turn, existing, controller, function (id) { intervalId = id; }, finish);
      return;
    }
    if (mode === "unconfigured" || !pack) {
      if (pack) pack.applyUnconfigured(turn);
      else {
        turn.terminal = true;
        turn.pending = false;
        turn.failed = true;
        turn.text = textOf("unconfigured");
      }
      finish("done");
      return;
    }

    var fresh = loadStore().sessions[sessionId];
    var request = pack.createRequest(userMessage.text, priorMessages(fresh, userMessageId, assistantId));
    if (!request.ok) {
      if (request.code === "empty") {
        finish("user");
        return;
      }
      pack.applyLocalMessage(turn, request.message);
      finish("done");
      return;
    }
    if (mode === "mock") {
      runMock(sessionId, assistantId, request.body.history, turn, controller, function (id) { intervalId = id; }, finish);
      return;
    }
    runFetch(request, turn, controller, finish);
  }

  function runDemo(session, question, turn, existing, controller, setIntervalId, finish) {
    if (currentMode() !== "demo") {
      finish("done");
      return;
    }
    var answer = composeAnswer(question, session);
    existing.intent = answer.intent;
    existing.label = answer.label;
    var store = loadStore();
    var live = store.sessions[session.id];
    if (live) {
      live.messages.forEach(function (message) {
        if (message.id === existing.id) {
          message.intent = answer.intent;
          message.label = answer.label;
        }
      });
      saveStore(store);
    }
    var sources = validatedSources(answer.sources);
    var full = answer.text || "";
    var index = turn.text ? turn.text.length : 0;
    var step = full.length > 320 ? 4 : 2;
    var timer = window.setInterval(function () {
      if (controller.signal && controller.signal.aborted) return;
      index = Math.min(full.length, index + step);
      turn.text = full.slice(0, index);
      turn.pending = index < full.length;
      persistTurn(session.id, existing.id, turn);
      if (index < full.length) return;
      window.clearInterval(timer);
      turn.sources = sources;
      turn.sourceIds = sources.map(function (source) { return source.id; }).filter(Boolean);
      turn.pending = false;
      turn.terminal = true;
      turn.complete = true;
      turn.intent = answer.intent;
      var again = loadStore();
      var saved = again.sessions[session.id];
      if (saved) {
        saved.messages.forEach(function (message) {
          if (message.id === existing.id) {
            message.intent = answer.intent;
            message.label = answer.label;
          }
        });
        saveStore(again);
      }
      finish("done");
    }, 28);
    setIntervalId(timer);
  }

  function runMock(sessionId, assistantId, history, turn, controller, setIntervalId, finish) {
    var pack = api();
    var scenario = selectedScenario();
    var name = scenarioFile(scenario, history);
    var file = name ? fixtureFile(name) : null;
    if (scenario === "network" || !file || !pack) {
      if (pack) pack.applyLocalMessage(turn, textOf("network"));
      finish("done");
      return;
    }
    if (file.contentType.indexOf("text/event-stream") === -1) {
      pack.applyHttp(turn, pack.interpretHttp(file.status, file.body));
      finish("done");
      return;
    }
    var delay = mockDelay();
    var events = pack.parseSse(file.body);
    if (delay > 0) {
      var expanded = [];
      events.forEach(function (event) {
        var tokenText = event.event === "token" && event.data ? event.data.text : "";
        if (typeof tokenText !== "string" || Array.from(tokenText).length <= 2) {
          expanded.push(event);
          return;
        }
        var chars = Array.from(tokenText);
        for (var i = 0; i < chars.length; i += 2) {
          expanded.push({ event: "token", data: { text: chars.slice(i, i + 2).join("") } });
        }
      });
      events = expanded;
    }
    var index = 0;
    function applyOne() {
      if (!events[index]) return false;
      pack.applySseEvent(turn, events[index]);
      index += 1;
      persistTurn(sessionId, assistantId, turn);
      return true;
    }
    if (delay === 0) {
      while (index < events.length && !(controller.signal && controller.signal.aborted)) {
        applyOne();
        if (turn.terminal) break;
      }
      if (turn.terminal || (controller.signal && controller.signal.aborted)) {
        finish("done");
        return;
      }
      if (scenario === "hang") return;
      finish(scenario === "stop" ? "user" : "end");
      return;
    }
    var timer = window.setInterval(function () {
      if (controller.signal && controller.signal.aborted) return;
      if (index >= events.length) {
        window.clearInterval(timer);
        if (scenario === "hang") return;
        finish(scenario === "stop" ? "user" : "end");
        return;
      }
      applyOne();
      if (turn.terminal) finish("done");
    }, delay);
    setIntervalId(timer);
  }

  function runFetch(request, turn, controller, finish) {
    var pack = api();
    var endpoint = pack.resolveEndpoint(document.documentElement.dataset.askApi);
    if (!endpoint) {
      pack.applyUnconfigured(turn);
      finish("done");
      return;
    }
    var init = pack.createFetchInit(request.json, controller.signal);
    fetch(endpoint, init).then(function (response) {
      if (controller.signal.aborted) return null;
      var type = String(response.headers.get("content-type") || "").toLowerCase();
      if (response.status === 200 && type.indexOf("text/event-stream") !== -1 && response.body) {
        return readStream(response, turn, controller);
      }
      return response.text().then(function (body) {
        pack.applyHttp(turn, pack.interpretHttp(response.status, body));
      });
    }).then(function () {
      if (controller.signal.aborted) return;
      finish(turn.terminal ? "done" : "end");
    }).catch(function () {
      if (controller.signal.aborted) return;
      if (!turn.terminal) {
        if (!turn.text) pack.applyLocalMessage(turn, textOf("network"));
        else pack.applyIncomplete(turn);
      }
      finish("done");
    });
  }

  function readStream(response, turn, controller) {
    var pack = api();
    var reader = response.body.getReader();
    var decoder = new TextDecoder("utf-8");
    var parser = pack.createParser();
    function pump() {
      return reader.read().then(function (result) {
        if (controller.signal.aborted) return null;
        if (result.done) {
          parser.finish().forEach(function (event) {
            pack.applySseEvent(turn, event);
          });
          if (active) persistTurn(active.sessionId, active.assistantId, turn);
          return null;
        }
        parser.push(decoder.decode(result.value, { stream: true })).forEach(function (event) {
          pack.applySseEvent(turn, event);
        });
        if (active) persistTurn(active.sessionId, active.assistantId, turn);
        if (turn.terminal) return null;
        return pump();
      });
    }
    return pump();
  }

  function stopActive(reason) {
    if (!active || !active.stop) return;
    active.stop(reason || "user");
  }

  function stopGeneration() {
    if (!active) return;
    stopActive("user");
  }

  function syncChat() {
    if (!chatIsActive()) return;
    setupMockNote();
    var sessionId = resolveSessionId();
    var session = sessionId ? findOneSession(sessionId) : null;
    renderSession(session);
    if (!session) {
      setGeneratingUI(false);
      return;
    }
    var last = session.messages[session.messages.length - 1];
    if (!last || (last.role === "assistant" && !last.pending)) {
      setGeneratingUI(false);
      return;
    }
    var userMessage = null;
    for (var i = session.messages.length - 1; i >= 0; i -= 1) {
      if (session.messages[i].role === "user") {
        userMessage = session.messages[i];
        break;
      }
    }
    if (userMessage) startGeneration(session.id, userMessage.id);
  }

  function markNav(isAsk) {
    if (runtime !== "file") return;
    document.querySelectorAll("#sidebar .nav-item").forEach(function (item) {
      item.classList.remove("active");
    });
    var link = document.querySelector(isAsk ? "[data-ask-nav='ask']" : "[data-ask-nav='home']");
    if (link && link.closest(".nav-item")) link.closest(".nav-item").classList.add("active");
    var title = document.getElementById("topbar-title");
    if (title) {
      if (!title.dataset.askHomeTitle) title.dataset.askHomeTitle = title.textContent.trim();
      title.textContent = isAsk ? "AI 问答" : title.dataset.askHomeTitle;
    }
  }

  function showView(name) {
    var home = document.getElementById("view-home");
    var ask = document.getElementById("view-ask");
    if (!home || !ask) return;
    home.hidden = name !== "home";
    ask.hidden = name !== "ask";
    document.dispatchEvent(new CustomEvent("ask-view", { detail: { view: name } }));
    markNav(name === "ask");
    if (name === "home") {
      if (active) stopActive("leave");
      var input = document.getElementById("ask-input");
      if (input) input.value = "";
      showHint("home", "");
      resetHomeSend();
      window.scrollTo(0, 0);
      return;
    }
    if (active) stopActive("leave");
    window.scrollTo(0, 0);
    syncChat();
  }

  function resetHomeSend() {
    var button = document.getElementById("ask-send");
    if (button) {
      button.textContent = "发送";
      button.removeAttribute("aria-busy");
    }
  }

  function markHomeSending() {
    var button = document.getElementById("ask-send");
    if (!button) return;
    button.setAttribute("aria-busy", "true");
    button.textContent = "发送中";
  }

  function sendHome(text) {
    if (sendGuard) return;
    var value = String(text || "").trim();
    if (!value) {
      showHint("home", "请输入内容后再发送");
      var homeInput = document.getElementById("ask-input");
      if (homeInput) homeInput.focus();
      return;
    }
    sendGuard = true;
    markHomeSending();
    if (active) stopActive("user");
    var id = createSession(value);
    var input = document.getElementById("ask-input");
    if (input) input.value = "";
    showHint("home", "");
    if (runtime === "file") {
      history.pushState({ askView: "ask", askSessionId: id }, "", location.pathname);
      sendGuard = false;
      showView("ask");
      return;
    }
    sessionStorage.setItem(PENDING_KEY, id);
    sessionStorage.setItem(CLEAR_HOME_KEY, "1");
    window.location.assign(askPageUrl());
  }

  function sendChat(text) {
    if (sendGuard) return;
    if (active) {
      showHint("chat", "请先停止，或等这一条结束");
      return;
    }
    var value = String(text || "").trim();
    if (!value) {
      var onEmpty = document.getElementById("ask-empty") && !document.getElementById("ask-empty").hidden;
      showHint(onEmpty ? "empty" : "chat", "请输入内容后再发送");
      var focus = document.getElementById(onEmpty ? "ask-empty-input" : "ask-chat-input");
      if (focus) focus.focus();
      return;
    }
    sendGuard = true;
    showHint("chat", "");
    showHint("empty", "");
    var sessionId = resolveSessionId();
    var userMessage;
    if (!sessionId || !findOneSession(sessionId)) {
      sessionId = createSession(value);
      adoptSession(sessionId);
      userMessage = findOneSession(sessionId).messages[0];
    } else {
      userMessage = appendUser(sessionId, value);
    }
    ["ask-chat-input", "ask-empty-input"].forEach(function (id) {
      var field = document.getElementById(id);
      if (field) field.value = "";
    });
    sendGuard = false;
    startGeneration(sessionId, userMessage.id);
  }

  function bindComposer(textarea, submit) {
    if (!textarea || textarea.dataset.askBound === "1") return;
    textarea.dataset.askBound = "1";
    var composing = false;
    var ignoreEnterUntil = 0;
    textarea.addEventListener("compositionstart", function () {
      composing = true;
    });
    textarea.addEventListener("compositionend", function () {
      composing = false;
      ignoreEnterUntil = performance.now() + 80;
    });
    textarea.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" || event.shiftKey) return;
      if (event.isComposing || composing || event.keyCode === 229 || performance.now() < ignoreEnterUntil) return;
      event.preventDefault();
      submit();
    });
    textarea.addEventListener("input", function () {
      var which = textarea.id === "ask-chat-input" ? "chat" : textarea.id === "ask-empty-input" ? "empty" : "home";
      if (textarea.value.trim()) showHint(which, "");
    });
  }

  function setupMockNote() {
    var note = document.getElementById("ask-mock-note");
    if (!note) return;
    var mock = currentMode() === "mock";
    note.hidden = !mock;
    if (!mock) return;
    var select = document.getElementById("ask-mock-scenario");
    if (!select || select.dataset.askReady === "1") return;
    select.dataset.askReady = "1";
    MOCK_SCENARIOS.forEach(function (item) {
      var option = document.createElement("option");
      option.value = item.id;
      option.textContent = item.label;
      select.appendChild(option);
    });
    var initial = selectedScenario();
    if (initial !== "hang") select.value = initial;
    select.addEventListener("change", function () {
      rememberScenario(select.value);
    });
  }

  function bindAll() {
    var homeForm = document.getElementById("ask-hero-form");
    if (homeForm) {
      homeForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var input = document.getElementById("ask-input");
        sendHome(input ? input.value : "");
      });
    }
    var emptyForm = document.getElementById("ask-empty-form");
    if (emptyForm) {
      emptyForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var input = document.getElementById("ask-empty-input");
        sendChat(input ? input.value : "");
      });
    }
    var chatForm = document.getElementById("ask-chat-form");
    if (chatForm) {
      chatForm.addEventListener("submit", function (event) {
        event.preventDefault();
        var input = document.getElementById("ask-chat-input");
        sendChat(input ? input.value : "");
      });
    }
    bindComposer(document.getElementById("ask-input"), function () {
      var input = document.getElementById("ask-input");
      sendHome(input ? input.value : "");
    });
    bindComposer(document.getElementById("ask-empty-input"), function () {
      var input = document.getElementById("ask-empty-input");
      sendChat(input ? input.value : "");
    });
    bindComposer(document.getElementById("ask-chat-input"), function () {
      var input = document.getElementById("ask-chat-input");
      sendChat(input ? input.value : "");
    });
    var stop = document.getElementById("ask-stop");
    if (stop) stop.addEventListener("click", stopGeneration);
    document.addEventListener("click", function (event) {
      var homeNav = event.target.closest("[data-ask-nav='home']");
      if (homeNav && runtime === "file") {
        event.preventDefault();
        history.pushState({ askView: "home" }, "", location.pathname);
        showView("home");
        return;
      }
      var askNav = event.target.closest("[data-ask-nav='ask']");
      if (!askNav) return;
      sessionStorage.removeItem(PENDING_KEY);
      if (runtime !== "file") return;
      event.preventDefault();
      history.pushState({ askView: "ask" }, "", location.pathname);
      showView("ask");
    });
    if (runtime === "file") {
      window.addEventListener("popstate", function (event) {
        var view = event.state && event.state.askView === "ask" ? "ask" : "home";
        showView(view);
      });
    }
  }

  function boot() {
    if (document.documentElement.dataset.askBound !== "1") {
      document.documentElement.dataset.askBound = "1";
      bindAll();
    }
    setupMockNote();
    if (runtime === "file") {
      if (!history.state || !history.state.askView) {
        history.replaceState({ askView: "home" }, "", location.pathname);
      }
      applyGreeting();
      var initial = history.state && history.state.askView === "ask" ? "ask" : "home";
      showView(initial);
      return;
    }
    applyGreeting();
    if (document.getElementById("ask-app")) syncChat();
    else updateRemaining(loadRemaining());
  }

  window.addEventListener("scroll", function () {
    if (scrollLock) return;
    followAnswer = nearBottom();
  }, { passive: true });

  window.addEventListener("pagehide", function () {
    if (active) stopActive("leave");
  });

  window.addEventListener("pageshow", function (event) {
    if (event.persisted && active) stopActive("leave");
    var homeInput = document.getElementById("ask-input");
    if (homeInput && sessionStorage.getItem(CLEAR_HOME_KEY) === "1") {
      homeInput.value = "";
      sessionStorage.removeItem(CLEAR_HOME_KEY);
    }
    resetHomeSend();
    sendGuard = false;
    if (runtime === "site" && document.getElementById("ask-app")) syncChat();
  });

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
  <script>
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var next = root.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-bs-theme", next);
      this.textContent = next === "dark" ? "浅色" : "深色";
    });
    document.getElementById("menu-button").addEventListener("click", function () {
      document.getElementById("sidebar").classList.toggle("open");
    });
  </script>
