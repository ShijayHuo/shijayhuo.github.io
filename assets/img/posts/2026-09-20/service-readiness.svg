<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc" data-quality-profile="standard">
<title id="title">跨服务发布与就绪</title><desc id="desc"></desc>
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="1080" height="440" rx="8" fill="#ffffff" stroke="none" stroke-width="1.5" data-graph-role="background"/>
<rect x="48" y="40" width="328" height="344" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" data-graph-role="container"/>
<rect x="536" y="40" width="496" height="344" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" data-graph-role="container"/>
<text x="72" y="80" font-size="23" fill="#111827" text-anchor="start" font-weight="600">流程设计</text>
<text x="560" y="80" font-size="23" fill="#111827" text-anchor="start" font-weight="600">流程运行</text>
<rect x="80" y="152" width="264" height="96" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.5" data-graph-role="node" id="published" data-node-id="published"/>
<text x="212.0" y="200.0" font-size="24" fill="#111827" text-anchor="middle" font-weight="600">已发布</text>
<text x="212.0" y="228.0" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="400">固定版本</text>
<rect x="568" y="120" width="192" height="72" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" data-graph-role="node" id="pending" data-node-id="pending"/>
<text x="664.0" y="164.0" font-size="24" fill="#111827" text-anchor="middle" font-weight="600">未就绪</text>
<rect x="568" y="272" width="192" height="72" rx="8" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.5" data-graph-role="node" id="ready" data-node-id="ready"/>
<text x="664.0" y="316.0" font-size="24" fill="#111827" text-anchor="middle" font-weight="600">已就绪</text>
<rect x="840" y="272" width="160" height="72" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" data-graph-role="node" id="instance" data-node-id="instance"/>
<text x="920.0" y="316.0" font-size="24" fill="#111827" text-anchor="middle" font-weight="600">实例</text>
<path id="edge-1" data-graph-role="edge" data-source="published" data-target="ready" d="M 344,200 L 456,200 L 456,308 L 568,308" fill="none" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow-purple)" stroke-dasharray="6 5"/>
<text x="436" y="180" font-size="18" fill="#9333ea" text-anchor="middle" font-weight="400">同步版本</text>
<path id="edge-2" data-graph-role="edge" data-source="pending" data-target="ready" d="M 664,192 L 664,272" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="682" y="238" font-size="18" fill="#2563eb" text-anchor="start" font-weight="400">接收并保存</text>
<path id="edge-3" data-graph-role="edge" data-source="ready" data-target="instance" d="M 760,308 L 840,308" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
<text x="800" y="290" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="400">启动</text>
<text x="792" y="164" font-size="18" fill="#6b7280" text-anchor="start" font-weight="400">失败可重试</text>
<text x="48" y="420" font-size="16" fill="#6b7280" text-anchor="start" font-weight="400">实线：操作／状态转换　　虚线：异步同步</text>
</svg>
