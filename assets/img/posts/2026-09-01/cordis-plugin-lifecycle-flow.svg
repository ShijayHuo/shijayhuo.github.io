<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 910" width="1400" height="910" role="img" aria-labelledby="title desc">
  <title id="title">Cordis 插件完整生命周期</title>
  <desc id="desc">三条分行流程分别展示插件注册与启动、手动停止单个 effect，以及卸载整个 Fiber。</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .lane-title { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
    .node-title { fill: #111827; font-size: 14px; font-weight: 600; }
    .node-subtitle { fill: #6b7280; font-size: 11px; }
    .badge-text { fill: #ffffff; font-size: 11px; font-weight: 700; }
  </style>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="910" fill="#ffffff"/>

  <g data-graph-role="container" data-container-id="startup">
    <rect data-graph-role="container" x="24" y="20" width="1352" height="270" rx="16" fill="#eff6ff" fill-opacity="0.72" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="48" y="50" class="lane-title" fill="#1d4ed8">01 · 注册与启动</text>
  </g>

  <g data-graph-role="container" data-container-id="manual-stop">
    <rect data-graph-role="container" x="24" y="320" width="1352" height="170" rx="16" fill="#f0fdf4" fill-opacity="0.82" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="48" y="350" class="lane-title" fill="#15803d">02 · 手动停止：只回收一个 effect</text>
  </g>

  <g data-graph-role="container" data-container-id="fiber-unload">
    <rect data-graph-role="container" x="24" y="520" width="1352" height="370" rx="16" fill="#fff7ed" fill-opacity="0.84" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="48" y="550" class="lane-title" fill="#c2410c">03 · 插件卸载：消费整个 Fiber</text>
  </g>

  <!-- 注册与启动：第一行向右，第二行折返向左。 -->
  <g fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path data-graph-role="edge" data-source="plugin" data-target="create-fiber" d="M 314 107 H 390" marker-end="url(#arrow-blue)"/>
    <path data-graph-role="edge" data-source="create-fiber" data-target="register-dispose" d="M 640 107 H 716" marker-end="url(#arrow-blue)"/>
    <path data-graph-role="edge" data-source="register-dispose" data-target="reload" d="M 966 107 H 1042" marker-end="url(#arrow-blue)"/>
    <path data-graph-role="edge" data-source="reload" data-target="execute" d="M 1167 144 V 190" marker-end="url(#arrow-blue)"/>
    <path data-graph-role="edge" data-source="execute" data-target="create-resource" d="M 1042 227 H 966" marker-end="url(#arrow-blue)"/>
    <path data-graph-role="edge" data-source="create-resource" data-target="register-wrapper" d="M 716 227 H 640" marker-end="url(#arrow-blue)"/>
    <path data-graph-role="edge" data-source="register-wrapper" data-target="active" d="M 390 227 H 314" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- ACTIVE 分出单 effect 停止与整个 Fiber 卸载。 -->
  <g fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path data-graph-role="edge" data-source="active" data-target="manual-stop-trigger" d="M 190 264 V 305 H 370 V 375" marker-end="url(#arrow-green)"/>
    <path data-graph-role="edge" data-source="manual-stop-trigger" data-target="single-wrapper" d="M 480 412.5 H 540" marker-end="url(#arrow-green)"/>
    <path data-graph-role="edge" data-source="single-wrapper" data-target="wait-task" d="M 760 412.5 H 820" marker-end="url(#arrow-green)"/>
    <path data-graph-role="edge" data-source="wait-task" data-target="reverse-one-effect" d="M 1040 412.5 H 1100" marker-end="url(#arrow-green)"/>
  </g>

  <g fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path data-graph-role="edge" data-source="active" data-target="lifecycle-change" d="M 64 227 H 12 V 615 H 64" marker-end="url(#arrow-orange)"/>
    <path data-graph-role="edge" data-source="lifecycle-change" data-target="set-epoch" d="M 444 615 H 510" marker-end="url(#arrow-orange)"/>
    <path data-graph-role="edge" data-source="set-epoch" data-target="unload" d="M 890 615 H 956" marker-end="url(#arrow-orange)"/>
    <path data-graph-role="edge" data-source="unload" data-target="call-wrappers" d="M 1146 655 V 710" marker-end="url(#arrow-orange)"/>
    <path data-graph-role="edge" data-source="call-wrappers" data-target="run-disposers" d="M 956 750 H 890" marker-end="url(#arrow-orange)"/>
    <path data-graph-role="edge" data-source="run-disposers" data-target="await-cleanup" d="M 510 750 H 444" marker-end="url(#arrow-orange)"/>
    <path data-graph-role="edge" data-source="await-cleanup" data-target="pending-loading" d="M 150 790 V 808 H 170 V 825" marker-end="url(#arrow-orange)"/>
    <path data-graph-role="edge" data-source="await-cleanup" data-target="disposed" d="M 240 790 V 800 H 410 V 825" marker-end="url(#arrow-orange)"/>
  </g>

  <!-- 注册与启动节点。 -->
  <g data-graph-role="node" data-node-id="plugin">
    <rect x="64" y="70" width="250" height="74" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="90" cy="107" r="14" fill="#2563eb"/>
    <text x="90" y="111" text-anchor="middle" class="badge-text">1</text>
    <text x="116" y="101" class="node-title">ctx.plugin()</text>
    <text x="116" y="123" class="node-subtitle">注册插件</text>
  </g>

  <g data-graph-role="node" data-node-id="create-fiber">
    <rect x="390" y="70" width="250" height="74" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="416" cy="107" r="14" fill="#2563eb"/>
    <text x="416" y="111" text-anchor="middle" class="badge-text">2</text>
    <text x="442" y="101" class="node-title">创建子 Fiber</text>
    <text x="442" y="123" class="node-subtitle">建立插件实例</text>
  </g>

  <g data-graph-role="node" data-node-id="register-dispose">
    <rect x="716" y="70" width="250" height="74" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="742" cy="107" r="14" fill="#2563eb"/>
    <text x="742" y="111" text-anchor="middle" class="badge-text">3</text>
    <text x="768" y="101" class="node-title">注册 dispose</text>
    <text x="768" y="123" class="node-subtitle">父 Fiber 持有</text>
  </g>

  <g data-graph-role="node" data-node-id="reload">
    <rect x="1042" y="70" width="250" height="74" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="1068" cy="107" r="14" fill="#2563eb"/>
    <text x="1068" y="111" text-anchor="middle" class="badge-text">4</text>
    <text x="1094" y="101" class="node-title">_reload()</text>
    <text x="1094" y="123" class="node-subtitle">依赖满足</text>
  </g>

  <g data-graph-role="node" data-node-id="execute">
    <rect x="1042" y="190" width="250" height="74" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="1068" cy="227" r="14" fill="#2563eb"/>
    <text x="1068" y="231" text-anchor="middle" class="badge-text">5</text>
    <text x="1094" y="221" class="node-title">_execute()</text>
    <text x="1094" y="243" class="node-subtitle">执行插件函数</text>
  </g>

  <g data-graph-role="node" data-node-id="create-resource">
    <rect x="716" y="190" width="250" height="74" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="742" cy="227" r="14" fill="#2563eb"/>
    <text x="742" y="231" text-anchor="middle" class="badge-text">6</text>
    <text x="768" y="221" class="node-title">创建资源</text>
    <text x="768" y="243" class="node-subtitle">effect / on / provide</text>
  </g>

  <g data-graph-role="node" data-node-id="register-wrapper">
    <rect x="390" y="190" width="250" height="74" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="416" cy="227" r="14" fill="#2563eb"/>
    <text x="416" y="231" text-anchor="middle" class="badge-text">7</text>
    <text x="442" y="221" class="node-title">登记 wrapper</text>
    <text x="442" y="243" class="node-subtitle">进入 _disposables</text>
  </g>

  <g data-graph-role="node" data-node-id="active">
    <rect x="64" y="190" width="250" height="74" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="69" y="195" width="240" height="64" rx="9" fill="none" stroke="#86efac" stroke-width="1"/>
    <circle cx="90" cy="227" r="8" fill="#16a34a"/>
    <circle cx="90" cy="227" r="13" fill="none" stroke="#16a34a" stroke-width="1" opacity="0.35"/>
    <text x="116" y="221" class="node-title" fill="#14532d">ACTIVE</text>
    <text x="116" y="243" class="node-subtitle" fill="#166534">插件运行中</text>
  </g>

  <!-- 手动停止节点。 -->
  <g data-graph-role="node" data-node-id="manual-stop-trigger">
    <rect x="260" y="375" width="220" height="75" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="286" cy="412.5" r="15" fill="#16a34a"/>
    <text x="286" y="416.5" text-anchor="middle" class="badge-text">M1</text>
    <text x="314" y="405" class="node-title">手动 stop()</text>
    <text x="314" y="428" class="node-subtitle">调用返回的 wrapper</text>
  </g>

  <g data-graph-role="node" data-node-id="single-wrapper">
    <rect x="540" y="375" width="220" height="75" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="566" cy="412.5" r="15" fill="#16a34a"/>
    <text x="566" y="416.5" text-anchor="middle" class="badge-text">M2</text>
    <text x="594" y="405" class="node-title">单个 wrapper</text>
    <text x="594" y="428" class="node-subtitle">epoch 置为 false</text>
  </g>

  <g data-graph-role="node" data-node-id="wait-task">
    <rect x="820" y="375" width="220" height="75" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="846" cy="412.5" r="15" fill="#16a34a"/>
    <text x="846" y="416.5" text-anchor="middle" class="badge-text">M3</text>
    <text x="874" y="405" class="node-title">等待 task</text>
    <text x="874" y="428" class="node-subtitle">完成后调用 dispose()</text>
  </g>

  <g data-graph-role="node" data-node-id="reverse-one-effect">
    <rect x="1100" y="375" width="220" height="75" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="1126" cy="412.5" r="15" fill="#16a34a"/>
    <text x="1126" y="416.5" text-anchor="middle" class="badge-text">M4</text>
    <text x="1154" y="405" class="node-title">逆序清理</text>
    <text x="1154" y="428" class="node-subtitle">仅回收这一个 effect</text>
  </g>

  <!-- Fiber 卸载节点。 -->
  <g data-graph-role="node" data-node-id="lifecycle-change">
    <rect x="64" y="575" width="380" height="80" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="92" cy="615" r="15" fill="#ea580c"/>
    <text x="92" y="619" text-anchor="middle" class="badge-text">F1</text>
    <text x="122" y="600" class="node-title">生命周期变化</text>
    <text x="122" y="622" class="node-subtitle">配置更新 · 依赖消失 · 热重载</text>
    <text x="122" y="640" class="node-subtitle">父 Fiber 卸载</text>
  </g>

  <g data-graph-role="node" data-node-id="set-epoch">
    <rect x="510" y="575" width="380" height="80" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="538" cy="615" r="15" fill="#ea580c"/>
    <text x="538" y="619" text-anchor="middle" class="badge-text">F2</text>
    <text x="568" y="600" class="node-title">_setEpoch(INACTIVE)</text>
    <text x="568" y="622" class="node-subtitle">切换生命周期 epoch</text>
    <text x="568" y="640" class="node-subtitle">或调用 fiber.dispose()</text>
  </g>

  <g data-graph-role="node" data-node-id="unload">
    <rect x="956" y="575" width="380" height="80" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="984" cy="615" r="15" fill="#ea580c"/>
    <text x="984" y="619" text-anchor="middle" class="badge-text">F3</text>
    <text x="1014" y="600" class="node-title">_unload()</text>
    <text x="1014" y="622" class="node-subtitle">清空 Fiber._disposables</text>
    <text x="1014" y="640" class="node-subtitle">进入统一回收流程</text>
  </g>

  <g data-graph-role="node" data-node-id="call-wrappers">
    <rect x="956" y="710" width="380" height="80" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="984" cy="750" r="15" fill="#ea580c"/>
    <text x="984" y="754" text-anchor="middle" class="badge-text">F4</text>
    <text x="1014" y="735" class="node-title">调用 wrappers</text>
    <text x="1014" y="757" class="node-subtitle">倒序取出 effect wrapper</text>
    <text x="1014" y="775" class="node-subtitle">Fiber 层并发回收</text>
  </g>

  <g data-graph-role="node" data-node-id="run-disposers">
    <rect x="510" y="710" width="380" height="80" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="538" cy="750" r="15" fill="#ea580c"/>
    <text x="538" y="754" text-anchor="middle" class="badge-text">F5</text>
    <text x="568" y="735" class="node-title">执行 disposers</text>
    <text x="568" y="757" class="node-subtitle">effect 内部倒序取出</text>
    <text x="568" y="775" class="node-subtitle">一个接一个串行清理</text>
  </g>

  <g data-graph-role="node" data-node-id="await-cleanup">
    <rect x="64" y="710" width="380" height="80" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="92" cy="750" r="15" fill="#ea580c"/>
    <text x="92" y="754" text-anchor="middle" class="badge-text">F6</text>
    <text x="122" y="735" class="node-title">await 清理</text>
    <text x="122" y="757" class="node-subtitle">等待全部异步 disposer</text>
    <text x="122" y="775" class="node-subtitle">完成后进入最终状态</text>
  </g>

  <g data-graph-role="node" data-node-id="pending-loading">
    <rect x="50" y="825" width="240" height="44" rx="22" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
    <text x="170" y="844" text-anchor="middle" class="node-title" fill="#9a3412">PENDING / LOADING</text>
    <text x="170" y="861" text-anchor="middle" class="node-subtitle" fill="#c2410c">临时卸载，可重新装载</text>
  </g>

  <g data-graph-role="node" data-node-id="disposed">
    <rect x="320" y="825" width="180" height="44" rx="22" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <text x="410" y="844" text-anchor="middle" class="node-title" fill="#991b1b">DISPOSED</text>
    <text x="410" y="861" text-anchor="middle" class="node-subtitle" fill="#b91c1c">永久销毁</text>
  </g>
</svg>
